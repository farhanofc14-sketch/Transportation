
name: Build ExpenseMate APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip ExpenseMate_Phone_Cloud_Build.zip -d extracted

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p extracted/ExpenseMate \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseMate-APK
          path: extracted/ExpenseMate/app/build/outputs/apk/debug/app-debug.apk
